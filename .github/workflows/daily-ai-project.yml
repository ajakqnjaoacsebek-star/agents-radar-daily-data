name: Daily AI Project

on:
  schedule:
    # Every day at 08:30 CST (UTC+8), independent from Daily Inspiration.
    - cron: "30 0 * * *"
    # Daily catch-up at 11:45 CST; skip when today's card already exists.
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-project-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ai-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_PROJECT_VAULT_OWNER: ${{ vars.AI_PROJECT_VAULT_OWNER }}
      AI_PROJECT_VAULT_REPO: ${{ vars.AI_PROJECT_VAULT_REPO }}
      AI_PROJECT_VAULT_BRANCH: ${{ vars.AI_PROJECT_VAULT_BRANCH }}
      AI_PROJECT_VAULT_PATH: ${{ vars.AI_PROJECT_VAULT_PATH }}
      AI_PROJECT_VAULT_READ_TOKEN: ${{ secrets.AI_PROJECT_VAULT_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whether today's scheduled card already exists
        id: daily-gate
        shell: bash
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TARGET="digests/${DATE}/daily-ai-project.json"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -f "$TARGET" ]; then
            echo "Today's AI project already exists; skipping scheduled run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "AI project generation is required."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup pnpm
        if: steps.daily-gate.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        if: steps.daily-gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.daily-gate.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Select one source-bound AI project without a model call
        if: steps.daily-gate.outputs.should_run == 'true'
        run: pnpm ai-project:only
      - name: Commit AI project card and state
        if: steps.daily-gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/*/daily-ai-project.json digests/ai-project-state.json
          if git diff --cached --quiet; then
            echo "No new AI project card to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit --no-verify -m "ai-project: ${DATE} daily card"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Update web manifest
        if: steps.daily-gate.outputs.should_run == 'true'
        run: pnpm manifest
      - name: Commit manifest
        if: steps.daily-gate.outputs.should_run == 'true'
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit --no-verify -m "chore: update AI project manifest"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
