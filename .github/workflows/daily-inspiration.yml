name: Daily Inspiration

on:
  schedule:
    # 每天 00:15 UTC = 08:15 CST (UTC+8)，避开日报原定时间。
    - cron: "15 0 * * *"
    # 每天 03:30 UTC = 11:30 CST；当天卡片已存在时自动跳过。
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-inspiration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspiration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether today's scheduled card already exists
        id: daily-gate
        shell: bash
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TARGET="digests/${DATE}/daily-inspiration.json"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -f "$TARGET" ]; then
            echo "Today's inspiration already exists; skipping scheduled run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Inspiration generation is required."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.daily-gate.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.daily-gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.daily-gate.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate verified inspiration from signals and evergreen catalog
        if: steps.daily-gate.outputs.should_run == 'true'
        run: pnpm inspiration:only

      - name: Commit inspiration card
        if: steps.daily-gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/*/daily-inspiration.json digests/inspiration-state.json
          if git diff --cached --quiet; then
            echo "No new inspiration card to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit --no-verify -m "inspiration: ${DATE} daily card"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Update web manifest
        if: steps.daily-gate.outputs.should_run == 'true'
        run: pnpm manifest

      - name: Commit manifest
        if: steps.daily-gate.outputs.should_run == 'true'
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit --no-verify -m "chore: update inspiration manifest"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
