name: Daily Inspiration

on:
  schedule:
    # 每天 00:15 UTC = 08:15 CST (UTC+8)，避开日报原定时间。
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-inspiration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspiration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate verified inspiration from signals and evergreen catalog
        run: pnpm inspiration:only

      - name: Commit inspiration card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/*/daily-inspiration.json digests/inspiration-state.json
          if git diff --cached --quiet; then
            echo "No new inspiration card to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "inspiration: ${DATE} daily card"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest
        run: |
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update inspiration manifest"
            git pull --rebase
            git push
          fi
