name: Weekly AI Project Signals

on:
  schedule:
    # Saturday 23:30 UTC = Sunday 07:30 CST.
    - cron: "30 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ai-project-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh source-bound AI project signals
        run: pnpm ai-project:refresh
      - name: Commit signal pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/ai-project-signals.json
          if git diff --cached --quiet; then
            echo "No AI project signal changes"
          else
            git commit --no-verify -m "chore: refresh AI project signals"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
